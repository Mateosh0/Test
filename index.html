<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10152d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="AURA Weather"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>AURA Weather</title><link rel="stylesheet" href="style.css"></head><body><div class="ambient"></div><main class="app"><header><div class="brand"><span class="orb">✦</span> AURA <span class="brand-light">WEATHER</span></div><button class="icon-btn" id="locate" aria-label="Моя геолокація">⌖</button></header><section class="hero"><div class="place" id="place">Одеса <span>⌄</span></div><div class="date" id="date"></div><div class="weather-icon" id="weatherIcon">☀️</div><div class="temp"><span id="temp">--</span><span class="degree">°</span></div><div class="condition" id="condition">Завантаження погоди…</div><div class="highlow" id="highlow"></div></section><div class="search-area" id="searchArea"><div class="search-wrap"><span>⌕</span><input id="search" placeholder="Пошук міста…" autocomplete="off" aria-label="Пошук міста"></div><div class="results" id="results"></div></div><section class="glass"><div class="section-title"><span>Погодинний прогноз</span><span class="muted">24 години</span></div><div class="hours" id="hours"></div></section><section class="glass"><div class="section-title"><span>Прогноз на 10 днів</span><span>☷</span></div><div id="days"></div></section><section class="metrics"><div class="glass metric"><div class="metric-label">💧 ВОЛОГІСТЬ</div><div class="metric-value" id="humidity">--%</div><div class="metric-note">Відносна вологість</div></div><div class="glass metric"><div class="metric-label">〰 ВІТЕР</div><div class="metric-value" id="wind">--</div><div class="metric-note">км/год</div></div><div class="glass metric"><div class="metric-label">☀ УФ-ІНДЕКС</div><div class="metric-value" id="uv">--</div><div class="metric-note" id="uvNote">Ультрафіолет</div></div><div class="glass metric"><div class="metric-label">◉ ВІДЧУВАЄТЬСЯ</div><div class="metric-value" id="feels">--°</div><div class="metric-note">За відчуттями</div></div></section><footer>Погодні дані: Open-Meteo · AURA Weather</footer></main><div class="toast" id="toast" role="status"></div><script src="app.js"></script></body></html>
